[package]
name = "taffrail-ui"
description = "Desktop interface for Taffrail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "taffrail"
path = "src/main.rs"

[features]
bench = []
preview = ["gpui-kit/test-support"]

[dependencies]
chrono.workspace = true
gpui-kit.workspace = true
taffrail-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

# Read by cargo-packager in the release workflow. See docs/decisions/003-package-with-cargo-packager.md.
[package.metadata.packager]
product-name = "Taffrail"
identifier = "dev.opik.taffrail"
description = "A read-only Kubernetes console built around live logs"
homepage = "https://github.com/opikdev/taffrail"
publisher = "opikdev"
authors = ["opikdev"]
copyright = "Copyright 2026 the Taffrail contributors"
category = "DeveloperTool"
icons = [
    "assets/icon/32x32.png",
    "assets/icon/64x64.png",
    "assets/icon/128x128.png",
    "assets/icon/256x256.png",
    "assets/icon/512x512.png",
    "assets/icon/icon.icns",
    "assets/icon/icon.ico",
]
# LICENSE and THIRD-PARTY-LICENSES.html, which the release workflow writes with
# scripts/third-party-licenses.sh. They go in Contents/Resources in the Mac app and next to
# taffrail.exe from both Windows installers. The Linux job writes them to target/licenses/linux
# instead, so that the .deb and the AppImage hold them only in /usr/share/doc/taffrail.
resources = ["../../target/licenses/bundle/*"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# An ad-hoc signature seals the bundle. It is not a Developer ID signature.
signing-identity = "-"

[package.metadata.packager.deb]
desktop-template = "packaging/taffrail.desktop"
section = "devel"
# The binary links libxcb and libxkbcommon, and loads Vulkan, EGL for the OpenGL fallback,
# Wayland and fontconfig at run time.
depends = [
    "libc6",
    "libgcc-s1",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libvulkan1",
    "libwayland-client0",
    "libfontconfig1",
    "libfreetype6",
    "libegl1",
]

[package.metadata.packager.deb.files]
"../../target/licenses/linux/LICENSE" = "/usr/share/doc/taffrail/copyright"
"../../target/licenses/linux/THIRD-PARTY-LICENSES.html" = "/usr/share/doc/taffrail/THIRD-PARTY-LICENSES.html"

[package.metadata.packager.appimage.files]
"../../target/licenses/linux/LICENSE" = "/usr/share/doc/taffrail/LICENSE"
"../../target/licenses/linux/THIRD-PARTY-LICENSES.html" = "/usr/share/doc/taffrail/THIRD-PARTY-LICENSES.html"

[package.metadata.packager.nsis]
installer-icon = "assets/icon/icon.ico"
