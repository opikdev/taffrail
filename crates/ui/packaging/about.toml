# Read by cargo-about in scripts/third-party-licenses.sh. Keep `accepted` the same as
# `[licenses] allow` in deny.toml.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# List only what is compiled into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Taffrail's own crates are covered by LICENSE.
private = { ignore = true }
