<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Logs from many pods merging into one live tail, in the app's amber accent. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2B2F"/>
      <stop offset="1" stop-color="#101113"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <g fill="none" stroke-linecap="round" stroke-width="60">
    <path d="M 262 332 C 412 332 432 512 572 512" stroke="#9C9DA1"/>
    <path d="M 262 692 C 412 692 432 512 572 512" stroke="#9C9DA1"/>
    <path d="M 262 512 H 572" stroke="#E9E9E7"/>
    <path d="M 572 512 H 762" stroke="#E0AE4B"/>
  </g>
</svg>
