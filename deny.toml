[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "gpui-ce", reason = "AGENTS.md rules out GPUI CE" },
    { crate = "gpui-kit", wrappers = ["taffrail-ui"], reason = "Only the ui crate may import GPUI" },
    { crate = "gpui-pre", wrappers = [
        "gpui-base",
        "gpui-component",
        "gpui-kit",
        "gpui-kit-assets",
        "gpui-pre-apple",
        "gpui-pre-ios",
        "gpui-pre-linux",
        "gpui-pre-macos",
        "gpui-pre-platform",
        "gpui-pre-web",
        "gpui-pre-wgpu",
        "gpui-pre-windows",
    ], reason = "Only the ui crate may import GPUI, through gpui-kit" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
